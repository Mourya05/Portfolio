  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Cybernetic Grid & Beam -->
  <g opacity="0.06" stroke="#a78bfa" fill="none">
    <path d="M780 120h300v100H780zM840 260h240v100H840zM750 400h330v100H750z"/>
