  <g fill="#a78bfa" opacity="0.6">
    <rect x="680" y="170" width="6" height="6"/>
    <rect x="740" y="350" width="6" height="6"/>
    <rect x="620" y="450" width="6" height="6"/>
  </g>

  <!-- Accent violet chamfered bar -->
  <polygon points="90,140 96,140 96,480 90,490" fill="#a78bfa"/>
  
  <!-- Typography -->
  <text x="130" y="230" fill="#ece9f6" font-family="Sora, system-ui, sans-serif" font-size="64" font-weight="700" letter-spacing="-1">Mourya <tspan fill="#c4b5fd">Birru</tspan></text>
  <text x="130" y="300" fill="#a78bfa" font-family="Sora, system-ui, sans-serif" font-size="28" font-weight="600">CS Student · AI/ML, Data Science &amp; Software</text>
  <text x="130" y="360" fill="#9690ab" font-family="monospace" font-size="20">Final-Year B.Tech CSE (Class of 2027) · GCET Hyderabad</text>
  <text x="130" y="440" fill="#64748b" font-family="monospace" font-size="16">LLM Inference · Graph Attention Networks · Machine Learning · Full-Stack</text>
