<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Mourya Birru — CS Student · AI/ML, Data Science &amp; Software</title>
  <desc id="desc">Dark technical preview card in black-and-violet cybernetic palette for Mourya Birru portfolio.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07060c"/>
      <stop offset="1" stop-color="#100d19"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0.05"/>
